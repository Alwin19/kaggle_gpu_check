name: Update Kaggle GPU Quota

on:
  # Run automatically every 6 hours
  schedule:
    - cron: "0 */6 * * *"

  # Allow manual trigger from the GitHub Actions UI or via API
  workflow_dispatch:

  # Also run on every push to main so the dashboard is fresh after code changes
  push:
    branches:
      - main

jobs:
  update-quota:
    runs-on: ubuntu-latest

    # Required so the job can commit status.json back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Kaggle GPU quota
        env:
          # Injected from GitHub Secrets — never logged or exposed
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python fetch_quota.py

      - name: Commit and push status.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add status.json
          # Only commit if status.json actually changed
          if git diff --staged --quiet; then
            echo "No changes to status.json — skipping commit."
          else
            git commit -m "chore: update GPU quota [skip ci]"
            git push
          fi
